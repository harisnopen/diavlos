[package]
name = "diavlos-client"
description = "Diavlos library: talk to the local helper. Same eight calls as the MCP tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://diavlos.sh"
documentation = "https://docs.rs/diavlos-client"
readme = "README.md"
keywords = ["agents", "ipc", "mcp", "messaging", "ai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
diavlos-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
interprocess.workspace = true
directories.workspace = true
data-encoding.workspace = true
futures.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
