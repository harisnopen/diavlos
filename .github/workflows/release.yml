# Signed binaries and an SBOM from the first tag.
# Push a tag like v0.1.0 and this builds every platform, writes a CycloneDX
# SBOM, signs each archive with sigstore (keyless, tied to this repo's
# GitHub identity), and attaches everything to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  licenses:
    # MIT, Apache-2.0 and the BSDs all allow shipping a binary built from
    # their code, on the one condition that the copyright notice goes with
    # it. A bare binary in a tar.gz carries nobody's notice, so write the
    # notices out once and put the file in every archive below.
    name: third-party licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install cargo-about
        # The binary is behind the `cli` feature; without it the install
        # succeeds and produces nothing.
        run: cargo install cargo-about --locked --features cli
      - name: Generate
        run: |
          set -euo pipefail
          cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
          # An empty or tiny file would mean the template silently produced
          # nothing, which is worse than failing here.
          bytes=$(wc -c < THIRD-PARTY-LICENSES.txt)
          echo "wrote $bytes bytes"
          [ "$bytes" -gt 50000 ] || { echo "suspiciously small; refusing"; exit 1; }
          grep -q "^End of third-party licences." THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licences
          path: THIRD-PARTY-LICENSES.txt

  build:
    name: build (${{ matrix.target }})
    needs: [licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --release --locked -p diavlos --target ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: licences
      - name: Package
        shell: bash
        # LICENSE and THIRD-PARTY-LICENSES.txt travel inside the archive,
        # not merely beside it on the release page: the notice has to stay
        # with the copy, and a copy is what someone downloads.
        run: |
          set -euo pipefail
          mkdir -p dist
          cp LICENSE THIRD-PARTY-LICENSES.txt dist/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/diavlos.exe dist/
            (cd dist && 7z a diavlos-${{ matrix.target }}.zip diavlos.exe LICENSE THIRD-PARTY-LICENSES.txt)
            (cd dist && rm diavlos.exe LICENSE THIRD-PARTY-LICENSES.txt)
          else
            cp target/${{ matrix.target }}/release/diavlos dist/
            (cd dist && tar -czf diavlos-${{ matrix.target }}.tar.gz diavlos LICENSE THIRD-PARTY-LICENSES.txt)
            (cd dist && rm diavlos LICENSE THIRD-PARTY-LICENSES.txt)
          fi
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign
        shell: bash
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - run: |
          mkdir -p dist
          cp crates/cli/diavlos.cdx.json dist/diavlos-${GITHUB_REF_NAME}.cdx.json
          cosign sign-blob --yes --bundle dist/diavlos-${GITHUB_REF_NAME}.cdx.json.sigstore.json dist/diavlos-${GITHUB_REF_NAME}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: dist/*

  release:
    needs: [build, sbom, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Homebrew formula
        # A formula that installs the signed binary we just built, with the
        # real checksums, so the tap is a copy rather than a guess.
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sum() { sha256sum "dist/diavlos-$1.tar.gz" | cut -d' ' -f1; }
          base="https://github.com/${REPO}/releases/download/${TAG}"
          cat > dist/diavlos.rb <<RB
          # Generated by the release workflow for ${TAG}. Do not hand-edit.
          #   brew tap ${REPO%/*}/tap && brew install diavlos
          class Diavlos < Formula
            desc "The channel between AI agents: signed, typed, never lost"
            homepage "https://diavlos.sh"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/diavlos-aarch64-apple-darwin.tar.gz"
                sha256 "$(sum aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/diavlos-x86_64-apple-darwin.tar.gz"
                sha256 "$(sum x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/diavlos-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/diavlos-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "diavlos"
              prefix.install "LICENSE", "THIRD-PARTY-LICENSES.txt"
            end

            service do
              run [opt_bin/"diavlos", "helper"]
              keep_alive true
              log_path var/"log/diavlos.log"
              error_log_path var/"log/diavlos.log"
            end

            test do
              assert_match "diavlos", shell_output("#{bin}/diavlos --version")
            end
          end
          RB
          echo "wrote dist/diavlos.rb"
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Every archive has a sigstore bundle next to it (`*.sigstore.json`). Verify with:

                cosign verify-blob --bundle <file>.sigstore.json \
                  --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>

            The SBOM (CycloneDX) is `diavlos-${{ github.ref_name }}.cdx.json`.

            Every archive carries `LICENSE` and `THIRD-PARTY-LICENSES.txt` next to the binary: Diavlos is MIT, and the crates it is built from are named there with their own notices.

            `diavlos.rb` is the Homebrew formula for this release, with the checksums of the binaries above. The tap at `harisnopen/homebrew-tap` picks it up by itself, within the hour.
