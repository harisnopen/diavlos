# Publish a release to crates.io and the MCP Registry, from the browser.
#
# Run it by hand (Actions -> publish -> Run workflow) once the release
# build for a tag is done. No token is stored anywhere:
#
# - crates.io: trusted publishing. GitHub hands crates.io a short-lived
#   OIDC token proving this workflow, in this repo, is publishing. Each
#   crate is told once, in its crates.io settings, to believe us. See
#   docs/PUBLISHING.md.
# - MCP Registry: `mcp-publisher login github-oidc` proves the same thing
#   to the registry, which then accepts io.github.harisnopen/*.
#
# A crate version that is already on crates.io is skipped, so a re-run
# after a failure picks up where it stopped.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.1.1)"
        required: true
      mcp:
        description: "Also publish server.json to the MCP Registry"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # the OIDC tokens. Without this there is no way in.

jobs:
  crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Work out the tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag '$TAG' does not look like v1.2.3"; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: The crate version must match the tag
        env:
          WANT: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          got=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print({p["name"]: p["version"] for p in json.load(sys.stdin)["packages"]}["diavlos"])')
          if [ "$got" != "$WANT" ]; then
            echo "Cargo.toml says $got, tag says $WANT"
            exit 1
          fi
          echo "version $got matches the tag"

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish, lowest crate first
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          on_crates_io() {
            curl -sf -A "diavlos publish workflow (github.com/harisnopen/diavlos)" \
              "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null
          }
          for crate in diavlos-core diavlos-client diavlos; do
            if on_crates_io "$crate"; then
              echo "$crate $VERSION is already on crates.io; skipping"
              continue
            fi
            cargo publish --locked -p "$crate"
            # The next crate depends on this one: wait until the index has it.
            for _ in $(seq 1 30); do
              on_crates_io "$crate" && break
              sleep 10
            done
            on_crates_io "$crate" || { echo "$crate $VERSION never showed up"; exit 1; }
            echo "$crate $VERSION is on crates.io"
          done

  mcp:
    name: publish to the MCP Registry
    needs: crates
    if: ${{ inputs.mcp }}
    runs-on: ubuntu-latest
    steps:
      # server.json from the branch the workflow runs on (main), not the
      # tag: the listing can change after a release (a package taken out
      # or put back) without a new version. The check below still ties it
      # to the tag's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: server.json must name this version
        env:
          WANT: ${{ needs.crates.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          want = os.environ["WANT"]
          s = json.load(open("server.json"))
          bad = [s["version"]] + [p["version"] for p in s["packages"]]
          if any(v != want for v in bad):
              sys.exit(f"server.json names {bad}, tag says {want}")
          print("server.json names", want)
          PY

      - name: Get mcp-publisher (pinned, checksum checked)
        run: |
          set -euo pipefail
          url=https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          curl -sSfL "$url" -o mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=diavlos" | head -c 600
