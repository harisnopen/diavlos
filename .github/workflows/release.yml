# Signed binaries and an SBOM from the first tag.
# Push a tag like v0.1.0 and this builds every platform, writes a CycloneDX
# SBOM, signs each archive with sigstore (keyless, tied to this repo's
# GitHub identity), and attaches everything to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p diavlos --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/diavlos.exe dist/
            (cd dist && 7z a diavlos-${{ matrix.target }}.zip diavlos.exe && rm diavlos.exe)
          else
            cp target/${{ matrix.target }}/release/diavlos dist/
            (cd dist && tar -czf diavlos-${{ matrix.target }}.tar.gz diavlos && rm diavlos)
          fi
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        shell: bash
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - uses: sigstore/cosign-installer@v3
      - run: |
          mkdir -p dist
          cp crates/cli/diavlos.cdx.json dist/diavlos-${GITHUB_REF_NAME}.cdx.json
          cosign sign-blob --yes --bundle dist/diavlos-${GITHUB_REF_NAME}.cdx.json.sigstore.json dist/diavlos-${GITHUB_REF_NAME}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*

  release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Homebrew formula
        # A formula that installs the signed binary we just built, with the
        # real checksums, so the tap is a copy rather than a guess.
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sum() { sha256sum "dist/diavlos-$1.tar.gz" | cut -d' ' -f1; }
          base="https://github.com/${REPO}/releases/download/${TAG}"
          cat > dist/diavlos.rb <<RB
          # Generated by the release workflow for ${TAG}. Do not hand-edit.
          #   brew tap ${REPO%/*}/tap && brew install diavlos
          class Diavlos < Formula
            desc "The channel between AI agents: signed, typed, never lost"
            homepage "https://diavlos.sh"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/diavlos-aarch64-apple-darwin.tar.gz"
                sha256 "$(sum aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/diavlos-x86_64-apple-darwin.tar.gz"
                sha256 "$(sum x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/diavlos-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/diavlos-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "diavlos"
            end

            service do
              run [opt_bin/"diavlos", "helper"]
              keep_alive true
              log_path var/"log/diavlos.log"
              error_log_path var/"log/diavlos.log"
            end

            test do
              assert_match "diavlos", shell_output("#{bin}/diavlos --version")
            end
          end
          RB
          echo "wrote dist/diavlos.rb"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Every archive has a sigstore bundle next to it (`*.sigstore.json`). Verify with:

                cosign verify-blob --bundle <file>.sigstore.json \
                  --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>

            The SBOM (CycloneDX) is `diavlos-${{ github.ref_name }}.cdx.json`.

            `diavlos.rb` is the Homebrew formula for this release, with the checksums of the binaries above. The tap at `harisnopen/homebrew-tap` picks it up by itself, within the hour.
