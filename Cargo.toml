[workspace]
resolver = "2"
members = ["crates/core", "crates/client", "crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/harisnopen/diavlos"
rust-version = "1.95"

[workspace.dependencies]
diavlos-core = { path = "crates/core", version = "1.0.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
sha2 = "0.11"
data-encoding = "2"
ulid = "3"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
toml = "1"
toml_edit = "0.24"
iroh = "1.2"
interprocess = { version = "2", features = ["tokio"] }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
futures = "0.3"
async-trait = "0.1"
libc = "0.2"
regex = "1"
chacha20poly1305 = "0.11"
keyring = "4"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
fs4 = "1"
windows-service = "0.8"
diavlos-client = { path = "crates/client", version = "1.0.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
