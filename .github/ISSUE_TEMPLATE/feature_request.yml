name: Feature request
description: Something Diavlos should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: `LICENSE-PROMISE.md` lists what stays free and
        what the paid layer covers, and `docs/SPEC.md` describes the wire
        format. Both may already answer this.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The job, not the feature. What are you doing today instead, and
        what makes it bad?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
      description: A command, a flag, a message type — whatever shape it takes.
    validations:
      required: false
  - type: checkboxes
    id: promises
    attributes:
      label: The seven promises
      description: >-
        Diavlos will not ship a feature that breaks one of these. Worth a
        glance.
      options:
        - label: It does not favour one agent vendor over another.
        - label: It does not lose messages, or make reading destructive.
        - label: It needs no account, no API key and no paid service to work.
