name: site

on:
  push:
    branches: [main]
    paths: [site/**, README.md, docs/**, skills/**, SECURITY.md]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assemble the site and llms-full.txt
        run: |
          mkdir -p out
          cp site/index.html site/llms.txt out/
          cp security.txt out/
          mkdir -p out/.well-known && cp security.txt out/.well-known/
          {
            echo "# Diavlos: full text for LLMs"; echo
            for f in README.md docs/SPEC.md skills/diavlos/SKILL.md docs/THREAT-MODEL.md docs/RELAY.md docs/CI.md docs/PUBLISHING.md SECURITY.md LICENSE-PROMISE.md; do
              echo; echo "<!-- $f -->"; echo; cat "$f"; echo
            done
          } > out/llms-full.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
