name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back to the repository, so the token it
# gets should not be able to. Without this line the job inherits whatever
# the repository default is, which on many repositories is write to
# everything — a wide token handed to a build that runs code from every
# pull request.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test --workspace
      - name: Python and Node bindings (smoke)
        if: matrix.os == 'ubuntu-latest'
        env:
          DIAVLOS_BIN: ${{ github.workspace }}/target/debug/diavlos
        run: |
          python3 bindings/python/tests/smoke.py
          node bindings/node/test/smoke.js
