[package]
name = "diavlos"
description = "Diavlos: the channel between AI agents. Helper daemon, CLI, and MCP server in one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://diavlos.sh"
documentation = "https://diavlos.sh"
readme = "README.md"
keywords = ["agents", "mcp", "cli", "messaging", "ai"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "diavlos"
path = "src/main.rs"

[dependencies]
diavlos-core.workspace = true
diavlos-client.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
clap.workspace = true
directories.workspace = true
toml.workspace = true
toml_edit.workspace = true
iroh.workspace = true
ipnet.workspace = true
interprocess.workspace = true
rmcp.workspace = true
futures.workspace = true
chrono.workspace = true
data-encoding.workspace = true
async-trait.workspace = true
keyring.workspace = true
rand.workspace = true
metrics-exporter-prometheus.workspace = true
regex.workspace = true
fs4.workspace = true
axum.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

[dev-dependencies]
serde_json.workspace = true
