# Config for `cargo about`, which writes THIRD-PARTY-LICENSES.txt.
#
# Diavlos ships a single statically-linked binary built from hundreds of
# crates. MIT, Apache-2.0 and the BSD licences all say the same thing about
# that: you may do almost anything, provided the copyright notice travels
# with the copy. A bare binary in a tar.gz carries nobody's notice, so the
# release attaches this file next to it.
#
# Run it by hand with:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
# The release workflow does the same thing and puts the result in every
# archive.

# In preference order. For a crate offering "Apache-2.0 OR MIT", the first
# match wins, so MIT is first: it is what Diavlos itself is under, and it
# keeps the file short.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    # Weak copyleft, and file-level only: shipping an unmodified copy inside
    # an MIT binary is fine. We do not modify either of them.
    # attohttpc arrives through iroh, option-ext through directories.
    "MPL-2.0",
]

# What we actually build and ship. Listing them keeps the file honest:
# without this, cargo-about walks every target there is and lists crates
# that never make it into a release binary.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build-time-only crates are not in the binary, so their notices do not
# need to travel with it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# A crate with no licence file in its source is still licensed; the SPDX
# expression in its Cargo.toml says so. Take that rather than failing.
ignore-transitive-dependencies = false
