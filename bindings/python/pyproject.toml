[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diavlos"
version = "1.0.0"
description = "Diavlos: the channel between AI agents. Python binding, talks to the local helper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/harisnopen/diavlos"

[tool.setuptools.packages.find]
where = ["."]
include = ["diavlos*"]
